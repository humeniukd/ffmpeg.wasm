<html>
  <body>
    <h3>Quick Test</h3>
    <a id="output-video" download="output.wav">download</a><br/>
    <button type="button" id="start">Start</button>
    <button type="button" id="stop">Stop</button>
    <p id="message"></p>
    <script type="module">
      import { FFmpeg } from "/packages/ffmpeg/dist/esm/index.js";
      import { fetchFile } from "/packages/util/dist/esm/index.js";
      import { Recorder } from "./recorder.mjs";
      import { wavHeader } from "./wav-header.js";

      const message = document.getElementById('message');

      let ffmpeg = new FFmpeg();
      ffmpeg.on("log", ({message}) => {
        console.log(message);
      })
      ffmpeg.on("progress", ({progress}) => {
        message.innerHTML = `${progress * 100} %`;
      });
      await ffmpeg.load({
        coreURL: "/packages/core-mt/dist/esm/ffmpeg-core.js",
      });

      let recorder = new Recorder(() => {
        console.log("Permission denied");
      });

      const start = async () => {

        recorder.ondataavailable = async (f32, channelCount, sampleRate) => {
          const input = `input.wav`;
          const output = `output.bin`;

          console.log("f32", f32.length);

          const header = wavHeader(f32.length, channelCount, sampleRate);

          await ffmpeg.writeFile(input, new Uint8Array(f32.buffer));

          console.log("f32:", f32.length);

          await ffmpeg.exec(['-f', 'f32le', '-acodec', 'pcm_f32le', '-ac', `${channelCount}`, '-ar', `${sampleRate}`, '-i', input, '-filter:a', 'loudnorm=I=-14:TP=-1.5:LRA=11', '-f', 'f32le', '-acodec', 'pcm_f32le', '-ar', `${sampleRate}`, '-ac', `${channelCount}`, output]);
          const data = await ffmpeg.readFile(output);



          const url = URL.createObjectURL(new Blob([header, data], {type: 'audio/wav'}));
          const video = document.getElementById('output-video');
          video.href = url;
        }

        await recorder.openStream();

        recorder.start();
      }
      const startElm = document.getElementById('start');
      startElm.addEventListener('click', start);
      const stopElm = document.getElementById('stop');
      stopElm.addEventListener('click', () => {
        recorder.stop();
      });
    </script>
  </body>
</html>
